name: Release do app Android

# Gera o APK (e o AAB) assinados e publica uma Release com o APK em nome fixo
# hexor-fit.apk, para o link .../releases/latest/download/hexor-fit.apk valer sempre.
#
# Dispara com uma tag v* (ex.: git tag v1.0.1 && git push origin v1.0.1)
# ou manualmente pela aba Actions (informando a versão).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 1.0.1). Cria a tag v<versão> se ela não existir."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.versao }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: '$VERSION' (use 1.2.3)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore (dos secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta o secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hexor-fit.jks"

      - name: Build (APK + AAB assinados)
        shell: bash
        env:
          HEXOR_FIT_KEYSTORE: ${{ runner.temp }}/hexor-fit.jks
          HEXOR_FIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEXOR_FIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HEXOR_FIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease -PappVersion=${{ steps.v.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/hexor-fit.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/hexor-fit.aab
          rm -f "$RUNNER_TEMP/hexor-fit.jks"

      - name: Confere a assinatura
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs dist/hexor-fit.apk | grep -i "SHA-256"
          cd dist && sha256sum hexor-fit.apk hexor-fit.aab > SHA256SUMS.txt && ls -la

      - name: Publica a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Hexor Fit ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            App Android do Hexor Fit, versão ${{ steps.v.outputs.version }}.

            Baixe **hexor-fit.apk** abaixo e abra no celular (pode pedir para permitir "instalar apps desta fonte").
            O conteúdo do app é o próprio site fit.hexor.com.br, sempre atualizado.
          files: |
            dist/hexor-fit.apk
            dist/hexor-fit.aab
            dist/SHA256SUMS.txt
